openapi: 3.2.0
info:
  title: Greenly Carbon Analytics Ready API
  version: '1.5'
  description: '# Introduction

    The Greenly Carbon Analytics API is a set of RESTful services which enable the enrichment of bank transactions with carbon footprint analytics.'
  contact:
    email: contact@greenly.earth
servers:
- url: https://api.greenly.earth/v1.5
tags:
- name: Ready
paths:
  /ready:
    get:
      operationId: IsReady
      responses:
        '204':
          description: No content
        '401':
          description: Authentication Failed
        '503':
          description: Not ready
      tags:
      - Ready
      security: []
      parameters: []
      summary: Is ready
      x-summary-source: derived
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: api-key
      in: header
